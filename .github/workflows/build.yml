name: Validate and build
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: python -m pip install -r requirements-desktop.txt
      - run: npm ci
      - run: npm run build
      - run: python -m pytest -q
      - run: python -m PyInstaller desktop/fandian.spec --distpath release --workpath build --noconfirm
      - run: python scripts/package_desktop.py
      - run: python scripts/check_release.py --history --bundle release/FandianDazi
      - uses: actions/upload-artifact@v4
        with:
          name: FandianDazi-windows-x64
          path: |
            release/*.zip
            release/SHA256SUMS.txt
